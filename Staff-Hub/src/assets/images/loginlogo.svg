<svg width="300" height="310" viewBox="0 0 300 310" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>StaffHub logo</title>
  <desc>Hub and spoke network mark: a central node connected to five colorful staff nodes, with the StaffHub wordmark below.</desc>
  <defs>
    <linearGradient id="gCenter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B388FF"/>
      <stop offset="1" stop-color="#FF6B6B"/>
    </linearGradient>
  </defs>

  <!-- spokes -->
  <line x1="150" y1="110" x2="150" y2="55"  stroke="#FFD166" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="150" y1="110" x2="202" y2="93"  stroke="#4CC9F0" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="150" y1="110" x2="182" y2="155" stroke="#06D6A0" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="150" y1="110" x2="118" y2="155" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="150" y1="110" x2="98"  y2="93"  stroke="#B388FF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- staff nodes -->
  <circle cx="150" cy="55"  r="13" fill="#FFD166"/>
  <circle cx="202" cy="93"  r="13" fill="#4CC9F0"/>
  <circle cx="182" cy="155" r="13" fill="#06D6A0"/>
  <circle cx="118" cy="155" r="13" fill="#FF6B6B"/>
  <circle cx="98"  cy="93"  r="13" fill="#B388FF"/>

  <!-- central hub -->
  <circle cx="150" cy="110" r="22" fill="url(#gCenter)"/>

  <!-- wordmark -->
  <text x="150" y="250" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="34" text-anchor="middle" fill="#1F2430">StaffHub</text>
  <text x="150" y="276" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="11.5" letter-spacing="1.2" text-anchor="middle" fill="#8B93A3">EMPLOYEE MANAGEMENT SYSTEM</text>
</svg>
